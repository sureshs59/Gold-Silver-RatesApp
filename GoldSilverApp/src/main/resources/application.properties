management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers

resilience4j.circuitbreaker.instances.metalApi.slidingWindowSize=5
resilience4j.circuitbreaker.instances.metalApi.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.metalApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.metalApi.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.metalApi.permittedNumberOfCallsInHalfOpenState=2

resilience4j.retry.instances.metalApi.maxAttempts=3
resilience4j.retry.instances.metalApi.waitDuration=2s